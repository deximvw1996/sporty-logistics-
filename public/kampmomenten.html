<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kampmomenten — Sporty logistiek</title>
<link rel="stylesheet" href="/public/patroon.css">
<link rel="stylesheet" href="/public/kampmomenten.css">
</head><body>
<div class="frame"><div class="top"><div class="logo">Sporty logistiek</div><div class="rechts"><span class="per">Periode: <b id="per-naam">…</b> ▾<select id="per-kies" aria-label="Periode kiezen"></select></span><span id="wie"></span></div></div>
<div class="sub"><span class="r"><button class="knop licht klein" id="export">⬇ Export</button><button class="knop licht klein" id="genereer-alles">⚙ Genereer transport</button><button class="knop klein" id="nieuw">+ Kampmoment</button></span></div>
<div class="body"><div class="kaart lijst"><div class="filters"><input id="zoek" placeholder="🔍 Zoek locatie, thema, KV…"><span id="chips" style="display:contents"></span></div>
<div class="kopr"><span><input type="checkbox" id="alles" aria-label="Alles selecteren"></span><span>Locatie</span><span>Week · dagen</span><span>Thema</span><span>KV</span><span>Transport</span><span></span></div>
<div class="scroll" id="lijst"></div>
<div class="voet" id="voet"><span><span id="n-km">0 kampmomenten</span> · <span class="n" id="n-sel">0 geselecteerd</span></span><span class="bulk"><button class="knop klein" id="b-genereer">Genereer transport</button><button class="knop licht klein" id="b-kvlinks">KV-links sturen</button><button class="knop licht klein" id="b-thema">Thema toewijzen</button><button class="knop licht klein" id="b-weg">Verwijderen</button></span></div></div>
<div class="kaart" id="detail"><div class="leeg">Kies links een kampmoment.</div></div></div></div>
<div id="toasts"></div>
<script src="/public/nav.js"></script>
<script src="/public/themakeuze.js"></script>
<script src="/public/kampmoment-nieuw.js"></script>
<script src="/public/kampmomenten.js"></script>
</body></html>
