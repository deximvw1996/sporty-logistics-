<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Personeel — Sporty logistiek</title>

<link rel="stylesheet" href="/public/personeel.css">
</head><body>
<div class="frame"><div class="top"><div class="logo">Sporty logistiek</div><div class="rechts"><span class="per">Periode: <b id="per-naam">…</b> ▾<select id="per-kies" aria-label="Periode kiezen"></select></span><span id="wie"></span></div></div><div class="sub"><span class="r"><button class="knop licht klein" id="export">⬇ Export</button><button class="knop klein" id="nieuw">+ Persoon</button></span></div><div class="body"><div class="kaart lijst"><div class="filters"><input id="zoek" placeholder="🔍 Zoek naam, rol, telefoon…"><span class="chip act" data-f="alle">Alle <b>0</b></span><span class="chip" data-f="kantoor">Kantoor <b>0</b></span><span class="chip" data-f="chauffeur">Chauffeur <b>0</b></span><span class="chip" data-f="kv">KV <b>0</b></span><span class="chip" data-f="monitor">Monitor <b>0</b></span><span class="chip" data-f="zonder_pincode">⚠ Zonder pincode <b>0</b></span></div><div class="kopr"><span><input type="checkbox" id="alles" aria-label="Alles selecteren"></span><span>Naam</span><span>Rol</span><span>Telefoon</span><span>Laatst actief</span><span>Stand</span></div><div class="scroll" id="lijst"></div><div class="voet" id="voet"><span><span id="n-pers">0 personen</span> · <span class="n" id="n-sel">0 geselecteerd</span></span><span class="bulk"><button class="knop klein" id="b-uitn">Pincode-uitnodiging sturen</button><button class="knop licht klein" id="b-rol">Rol wijzigen</button><button class="knop licht klein" id="b-deact">Deactiveren</button></span></div></div><div class="kaart"><div class="detail" id="detail"><div class="leegd">Klik een persoon in de lijst voor het detail.</div></div></div></div></div>
<div id="toasts"></div>
<script src="/public/nav.js"></script>
<script src="/public/personeel.js"></script>
